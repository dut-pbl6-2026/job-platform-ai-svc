[project]
name = "job-platform-ai-svc"
version = "0.1.0"
description = "Resume scoring service (SCORE-01) - local models, no third-party AI APIs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "pytesseract>=0.3.10",
  "pillow>=10.3",
  "fastembed>=0.4.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "redis>=5.0",
  "pyjwt>=2.15.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "scipy>=1.13", "scikit-learn>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "S110"]  # B008: FastAPI File()/Form() defaults are idiomatic; S110: best-effort cache must not raise
